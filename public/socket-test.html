<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banglish Socket.IO Test</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #38bdf8; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; }
    .card h2 { color: #94a3b8; font-size: 14px; text-transform: uppercase; margin-bottom: 15px; }
    input, button, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; margin-bottom: 10px; font-size: 14px; }
    button { background: #3b82f6; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
    button:hover { background: #2563eb; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .btn-success { background: #22c55e; }
    .btn-success:hover { background: #16a34a; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    .status { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #ef4444; }
    .status-dot.connected { background: #22c55e; }
    .log { background: #0f172a; border-radius: 8px; padding: 15px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 13px; }
    .log-entry { padding: 5px 0; border-bottom: 1px solid #1e293b; }
    .log-entry.event { color: #22c55e; }
    .log-entry.error { color: #ef4444; }
    .log-entry.emit { color: #3b82f6; }
    .log-entry.info { color: #f59e0b; }
    .users-grid { display: grid; gap: 10px; max-height: 400px; overflow-y: auto; }
    .user-card { background: #0f172a; border-radius: 8px; padding: 15px; display: flex; align-items: center; gap: 15px; }
    .user-avatar { width: 50px; height: 50px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
    .user-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .user-info h3 { color: #f1f5f9; margin-bottom: 5px; }
    .user-info p { color: #94a3b8; font-size: 13px; }
    .tag { display: inline-block; background: #3b82f6; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin: 2px; }
    .online-badge { background: #22c55e; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
    .section { margin-top: 20px; }
    small { color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔌 Banglish Socket.IO Test</h1>
    
    <div class="grid">
      <!-- Auth Section -->
      <div class="card">
        <h2>1. Authentication</h2>
        <input type="email" id="email" placeholder="Email" value="test@example.com">
        <input type="password" id="password" placeholder="Password" value="Test@123456">
        <button onclick="login()" id="loginBtn">Login</button>
        <button onclick="register()" id="registerBtn" class="btn-success">Register New User</button>
        <small>Token will be saved automatically</small>
        <textarea id="token" rows="3" placeholder="Access Token (auto-filled after login)"></textarea>
      </div>

      <!-- Socket Connection -->
      <div class="card">
        <h2>2. Socket Connection</h2>
        <div class="status">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">Disconnected</span>
          <span id="onlineCount" style="margin-left: auto; color: #22c55e;"></span>
        </div>
        <button onclick="connectSocket()" id="connectBtn">Connect Socket</button>
        <button onclick="disconnectSocket()" id="disconnectBtn" class="btn-danger" disabled>Disconnect</button>
        
        <div class="section">
          <h2>3. Emit Events</h2>
          <button onclick="getActiveUsers()">Get Active Users</button>
          <button onclick="getOnlineCount()">Get Online Count</button>
          <button onclick="sendHeartbeat()">Send Heartbeat</button>
        </div>
      </div>
    </div>

    <!-- Logs -->
    <div class="card section">
      <h2>Event Logs</h2>
      <div class="log" id="log"></div>
    </div>

    <!-- Active Users -->
    <div class="card section">
      <h2>Active Users (<span id="userCount">0</span>)</h2>
      <div class="users-grid" id="usersGrid">
        <p style="color: #64748b;">Connect and click "Get Active Users" to see online users</p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000';
    let socket = null;

    // REST API Calls
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      try {
        log('Logging in...', 'info');
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (data.success) {
          document.getElementById('token').value = data.data.accessToken;
          log(`Login successful! User: ${data.data.user.email}`, 'event');
        } else {
          log(`Login failed: ${data.message}`, 'error');
        }
      } catch (err) {
        log(`Login error: ${err.message}`, 'error');
      }
    }

    async function register() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      try {
        log('Registering...', 'info');
        const res = await fetch(`${API_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            email, 
            password,
            profile: {
              fullName: 'Test User',
              country: 'Bangladesh'
            }
          })
        });
        const data = await res.json();
        
        if (data.success) {
          document.getElementById('token').value = data.data.accessToken;
          log(`Registration successful! User: ${data.data.user.email}`, 'event');
        } else {
          log(`Registration failed: ${data.message}`, 'error');
        }
      } catch (err) {
        log(`Registration error: ${err.message}`, 'error');
      }
    }

    // Socket.IO
    function connectSocket() {
      const token = document.getElementById('token').value;
      if (!token) {
        log('Please login first to get a token', 'error');
        return;
      }

      log('Connecting to Socket.IO...', 'info');
      
      socket = io(API_URL, {
        auth: { token }
      });

      socket.on('connect', () => {
        log(`Connected! Socket ID: ${socket.id}`, 'event');
        updateStatus(true);
      });

      socket.on('disconnect', (reason) => {
        log(`Disconnected: ${reason}`, 'error');
        updateStatus(false);
      });

      socket.on('connect_error', (err) => {
        log(`Connection error: ${err.message}`, 'error');
        updateStatus(false);
      });

      socket.on('error', (err) => {
        log(`Socket error: ${JSON.stringify(err)}`, 'error');
      });

      // Presence events
      socket.on('presence:count', (data) => {
        log(`Online count: ${data.count}`, 'event');
        document.getElementById('onlineCount').textContent = `${data.count} online`;
      });

      socket.on('user:online', (data) => {
        log(`User came online: ${data.userId}`, 'event');
        // Refresh active users
        getActiveUsers();
      });

      socket.on('user:offline', (data) => {
        log(`User went offline: ${data.userId}`, 'event');
        // Refresh active users
        getActiveUsers();
      });
    }

    function disconnectSocket() {
      if (socket) {
        socket.disconnect();
        socket = null;
        log('Manually disconnected', 'info');
        updateStatus(false);
      }
    }

    function updateStatus(connected) {
      document.getElementById('statusDot').classList.toggle('connected', connected);
      document.getElementById('statusText').textContent = connected ? 'Connected' : 'Disconnected';
      document.getElementById('connectBtn').disabled = connected;
      document.getElementById('disconnectBtn').disabled = !connected;
    }

    function getActiveUsers() {
      if (!socket?.connected) {
        log('Socket not connected', 'error');
        return;
      }

      log('Fetching active users...', 'emit');
      socket.emit('presence:getActiveUsers', { page: 1, limit: 50 }, (response) => {
        log(`Received ${response.users?.length || 0} active users`, 'event');
        renderUsers(response);
      });
    }

    function getOnlineCount() {
      if (!socket?.connected) {
        log('Socket not connected', 'error');
        return;
      }

      log('Fetching online count...', 'emit');
      socket.emit('presence:getCount', {}, (response) => {
        log(`Online count: ${response.count}`, 'event');
        document.getElementById('onlineCount').textContent = `${response.count} online`;
      });
    }

    function sendHeartbeat() {
      if (!socket?.connected) {
        log('Socket not connected', 'error');
        return;
      }

      log('Sending heartbeat...', 'emit');
      socket.emit('presence:heartbeat', {}, () => {
        log('Heartbeat acknowledged', 'event');
      });
    }

    function renderUsers(data) {
      const grid = document.getElementById('usersGrid');
      document.getElementById('userCount').textContent = data.total || 0;

      if (!data.users?.length) {
        grid.innerHTML = '<p style="color: #64748b;">No active users</p>';
        return;
      }

      grid.innerHTML = data.users.map(user => {
        const profile = user.profile || {};
        const initials = (profile.fullName || 'U').charAt(0).toUpperCase();
        const languages = profile.interestedLanguages || [];
        
        return `
          <div class="user-card">
            <div class="user-avatar">
              ${profile.profilePicture 
                ? `<img src="${profile.profilePicture}" alt="${profile.fullName}">` 
                : initials}
            </div>
            <div class="user-info">
              <h3>${profile.fullName || 'Unknown'} <span class="online-badge">Online</span></h3>
              <p>📍 ${profile.country || 'Unknown location'}</p>
              <p>
                ${languages.length 
                  ? languages.map(l => `<span class="tag">${l.name}</span>`).join('') 
                  : '<span style="color:#64748b">No languages set</span>'}
              </p>
            </div>
          </div>
        `;
      }).join('');
    }

    function log(message, type = '') {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${time}] ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Initial log
    log('Ready! Login or register, then connect socket.', 'info');
  </script>
</body>
</html>
